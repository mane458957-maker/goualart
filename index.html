<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#071a26">
<title>Goual Studio — Sites web premium & vidéo IA</title>
<meta name="description" content="Goual Studio crée des sites web premium qui font waouh : scroll animé, 3D, configurateurs. Basé à Dubaï, pour la France, le Golfe et les États-Unis.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--aq:#2bb3c0;--aq2:#38c6d9;--ink:#0b1620;--mut:#5b6875;--glass:rgba(255,255,255,.16);--glass2:rgba(255,255,255,.7)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:Inter,system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;user-select:none;background:#071a26}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
[data-en]{display:none}html[lang=en] [data-fr]{display:none}html[lang=en] [data-en]{display:revert}

/* ---------- fond d'écran (commun) ---------- */
.wall{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 90% at 10% 0%,#0f4c66 0%,#08263a 45%,#050f18 100%)}
.wall i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75;animation:float 22s ease-in-out infinite alternate}
.wall i:nth-child(1){width:55vmax;height:55vmax;left:-12vmax;top:-18vmax;background:#1fa7b8}
.wall i:nth-child(2){width:45vmax;height:45vmax;right:-14vmax;top:10vh;background:#1b5fa8;animation-duration:28s}
.wall i:nth-child(3){width:40vmax;height:40vmax;left:25vw;bottom:-22vmax;background:#2bd0b4;opacity:.45;animation-duration:34s}
.wall i:nth-child(4){width:22vmax;height:22vmax;right:18vw;bottom:8vh;background:#f2a65a;opacity:.28;animation-duration:26s}
@keyframes float{to{transform:translate(6vmax,4vmax) scale(1.12)}}
.wall .wm{position:absolute;right:4vw;bottom:15vh;text-align:right;opacity:.16;font-weight:800;line-height:.9;letter-spacing:-.06em;font-size:15vw;filter:none;animation:none;border-radius:0}
.wall .wm small{display:block;font-size:2vw;letter-spacing:1.2vw;font-weight:400;margin-top:1vw}

/* ---------- icônes d'apps (dessin maison) ---------- */
.ic{width:62px;height:62px;border-radius:16px;display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.35);position:relative;overflow:hidden}
.ic:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 45%)}
.ic svg{width:58%;height:58%;position:relative;z-index:1}
.i-pool{background:linear-gradient(145deg,#4fe0f0,#1279a8)}
.i-komi{background:linear-gradient(145deg,#ffc04d,#f07a18)}
.i-sin{background:linear-gradient(145deg,#ffffff,#e9ecef)}
.i-serv{background:linear-gradient(145deg,#1e2d3b,#0b1620)}
.i-mail{background:linear-gradient(145deg,#59c3ff,#1666d8)}
.i-wa{background:linear-gradient(160deg,#3fd34a,#22a52a)}
.ic img{width:66%;height:66%;position:relative;z-index:1;object-fit:contain}
.i-yt{background:linear-gradient(160deg,#ff3b3b,#c80d0d)}
.i-tt{background:linear-gradient(160deg,#1c1c22,#000)}
.i-me{background:linear-gradient(145deg,#c9b6ff,#6d4bd8)}
.i-lang{background:linear-gradient(145deg,#ff8aa8,#d9365f)}
.i-video{background:linear-gradient(145deg,#ff6b5b,#a3122f)}

/* =================== BUREAU (desktop) =================== */
.desk{position:fixed;inset:0}
.bar{position:absolute;top:0;left:0;right:0;height:30px;background:rgba(5,15,24,.38);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);display:flex;align-items:center;padding:0 14px;font-size:13px;z-index:500;gap:18px}
.bar .brand{font-weight:800;letter-spacing:-.5px;font-size:15px}.bar .brand i{font-style:normal;color:var(--aq2)}
.bar .m{opacity:.88;cursor:pointer}.bar .m:hover{opacity:1}
.bar .r{margin-left:auto;display:flex;gap:16px;align-items:center;opacity:.92}
.bar .lg button{padding:1px 6px;border-radius:5px;font-size:12px;font-weight:600;opacity:.6}.bar .lg button.on{opacity:1;background:rgba(255,255,255,.18)}
.icons{position:absolute;top:150px;right:22px;display:grid;gap:18px;z-index:2}
.dicon{width:96px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:500;text-shadow:0 1px 6px rgba(0,0,0,.5);cursor:pointer;padding:6px;border-radius:10px}
.dicon:hover{background:rgba(255,255,255,.1)}
.dicon .ic{width:56px;height:56px;border-radius:14px}
.dock{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:10px;padding:9px 12px;border-radius:24px;background:rgba(255,255,255,.14);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border:1px solid rgba(255,255,255,.22);z-index:400;align-items:flex-end}
.dock .di{position:relative;transition:transform .18s cubic-bezier(.3,.7,.4,1.4),margin .18s;cursor:pointer}
.dock .di:hover{transform:translateY(-12px) scale(1.25);margin:0 10px}
.dock .di .tip{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(10,20,30,.85);padding:4px 9px;border-radius:7px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .15s}
.dock .di:hover .tip{opacity:1}
.dock .di.open:after{content:"";position:absolute;bottom:-6px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#fff}
.dock .sep{width:1px;align-self:stretch;background:rgba(255,255,255,.25);margin:4px 2px}

.win{position:absolute;background:#fafbfc;color:var(--ink);border-radius:14px;box-shadow:0 40px 90px -20px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.4);overflow:hidden;display:flex;flex-direction:column;min-width:380px;min-height:260px;opacity:0;transform:scale(.94) translateY(14px);transition:opacity .22s,transform .25s cubic-bezier(.2,.8,.3,1.1)}
.win.show{opacity:1;transform:none}
.win.max{left:8px!important;top:38px!important;width:calc(100% - 16px)!important;height:calc(100% - 128px)!important}
.tb{height:42px;display:flex;align-items:center;padding:0 10px 0 16px;gap:10px;background:linear-gradient(#fff,#f1f4f7);border-bottom:1px solid #e3e8ee;cursor:grab;flex:none}
.tb:active{cursor:grabbing}
.tb .t{font-size:13px;font-weight:600;display:flex;align-items:center;gap:9px}
.tb .t .ic{width:22px;height:22px;border-radius:6px;box-shadow:none}
.tb .tabs{display:flex;gap:4px;margin-left:14px}
.tb .tabs button{font-size:12px;font-weight:600;padding:5px 11px;border-radius:8px;color:var(--mut)}
.tb .tabs button.on{background:#e6f6f8;color:#167f8a}
.tb .ctl{margin-left:auto;display:flex;gap:4px}
.tb .ctl button{width:30px;height:28px;border-radius:7px;display:grid;place-items:center;color:#55626e}
.tb .ctl button:hover{background:#e7ecf1}.tb .ctl button.x:hover{background:#e5484d;color:#fff}
.body{flex:1;overflow:auto;user-select:text;position:relative}
.body iframe{width:100%;height:100%;border:0;display:block;background:#fff}
.pane{display:none;height:100%}.pane.on{display:block}
.proj{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;padding:26px;align-items:start}
.proj .shot{border-radius:12px;overflow:hidden;box-shadow:0 18px 40px -18px rgba(11,22,32,.45),0 0 0 1px #e3e8ee;position:relative;aspect-ratio:16/10;background:#eef2f5}
.proj .shot img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .5s}
.proj .shot img.b{position:absolute;inset:0;opacity:0}.proj .shot:hover img.b{opacity:1}
.tag{display:inline-block;font-size:11px;font-weight:700;color:#167f8a;background:#e6f6f8;padding:4px 9px;border-radius:99px;margin:0 4px 4px 0;letter-spacing:.3px}
.proj h3{font-size:26px;letter-spacing:-.8px;line-height:1.1;margin:10px 0 10px}
.proj p{color:var(--mut);font-size:14.5px;line-height:1.6}
.proj ul{list-style:none;margin:14px 0 20px}.proj li{font-size:14px;padding:5px 0 5px 22px;position:relative;color:#243241}
.proj li:before{content:"";position:absolute;left:0;top:13px;width:12px;height:2px;background:var(--aq)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;padding:11px 18px;border-radius:11px;font-weight:600;font-size:14px;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}.btn.aq{background:var(--aq)}.btn.gh{background:#eef2f5;color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.welcome{padding:34px 34px 30px}
.welcome .ey{font-size:11px;font-weight:700;letter-spacing:3px;color:var(--aq)}
.welcome h1{font-size:40px;line-height:1.04;letter-spacing:-1.6px;margin:12px 0 12px;font-weight:800}
.welcome h1 em{font-style:normal;background:linear-gradient(90deg,#1fb6c9,#0f5f8a);-webkit-background-clip:text;background-clip:text;color:transparent}
.welcome p{color:var(--mut);font-size:15px;line-height:1.6;max-width:520px}
.welcome .launch{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0 18px}
.welcome .launch button{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:#f2f5f8;text-align:left;font-size:13px;font-weight:600;transition:background .15s}
.welcome .launch button:hover{background:#e6f6f8}
.welcome .launch .ic{width:36px;height:36px;border-radius:10px;flex:none}
.notes{padding:28px 30px}
.notes h2{font-size:26px;letter-spacing:-.8px;margin-bottom:16px}
.svc{display:grid;gap:12px}
.svc div{padding:16px 18px;border-radius:12px;background:#f2f5f8}
.svc b{display:block;font-size:15px;margin-bottom:4px}.svc span{color:var(--mut);font-size:14px}
.contact{padding:30px;text-align:center}
.contact .ic{width:72px;height:72px;margin:0 auto 14px;border-radius:20px}
.contact h2{font-size:26px;letter-spacing:-.8px}
.contact p{color:var(--mut);font-size:14.5px;margin:6px 0 20px}
.contact .row{justify-content:center}
.contact .nums{margin-top:18px;color:var(--mut);font-size:13.5px;display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.toast{position:absolute;bottom:110px;right:14px;width:320px;background:rgba(250,251,252,.92);backdrop-filter:blur(20px);color:var(--ink);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 20px 50px -18px rgba(0,0,0,.55);z-index:600;transform:translateX(120%);transition:transform .5s cubic-bezier(.2,.8,.3,1.1);cursor:pointer}
.toast.show{transform:none}
.toast .ic{width:38px;height:38px;border-radius:10px;flex:none}
.toast b{font-size:13px;display:block}.toast span{font-size:12.5px;color:var(--mut)}

/* =================== TÉLÉPHONE (mobile) =================== */
.phone{position:fixed;inset:0;display:none;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.sbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:15px;font-weight:600;flex:none}
.sbar .ri{display:flex;gap:6px;align-items:center}
.batt{width:25px;height:12px;border:1.5px solid rgba(255,255,255,.75);border-radius:4px;padding:1.5px;position:relative}.batt:after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;background:rgba(255,255,255,.75);border-radius:1px}.batt i{display:block;height:100%;width:80%;background:#fff;border-radius:1.5px}
.home{flex:1;overflow:hidden;padding:10px 22px 0;display:flex;flex-direction:column}
.widget{border-radius:24px;background:rgba(255,255,255,.14);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);border:1px solid rgba(255,255,255,.2);padding:16px 18px;margin-bottom:22px}
.widget .wl{display:flex;justify-content:space-between;align-items:flex-start}
.widget .lg2{font-weight:800;font-size:30px;letter-spacing:-1.4px;line-height:1}.widget .lg2 i{font-style:normal;color:var(--aq2)}
.widget small{display:block;font-size:9px;letter-spacing:4px;opacity:.75;margin-top:3px}
.widget .clk{text-align:right}.widget .clk b{font-size:26px;font-weight:300;letter-spacing:-1px;display:block;line-height:1}.widget .clk span{font-size:11.5px;opacity:.8}
.widget p{font-size:13.5px;line-height:1.45;margin-top:12px;opacity:.95}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 0;justify-items:center}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:500;text-shadow:0 1px 4px rgba(0,0,0,.4);transition:transform .15s}
.app:active{transform:scale(.9)}
.app .ic{width:60px;height:60px;border-radius:15px}
.dots{display:flex;gap:7px;justify-content:center;margin:auto 0 14px}.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45)}.dots i.on{background:#fff}
.pdock{margin:0 12px 10px;padding:12px 14px;border-radius:30px;background:rgba(255,255,255,.16);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);display:flex;justify-content:space-around;flex:none}
.pdock .ic{width:58px;height:58px;border-radius:15px}
.sheet{position:fixed;inset:0;background:#f6f8fa;color:var(--ink);z-index:50;display:flex;flex-direction:column;border-radius:34px;transform:scale(.3);opacity:0;pointer-events:none;transition:transform .42s cubic-bezier(.2,.9,.25,1.05),opacity .3s,border-radius .42s}
.sheet.show{transform:none;opacity:1;pointer-events:auto;border-radius:0}
.sheet .sh{padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;display:flex;align-items:center;gap:10px;background:rgba(246,248,250,.92);backdrop-filter:blur(14px);border-bottom:1px solid #e3e8ee;flex:none}
.sheet .sh b{font-size:17px}
.sheet .sh .ic{width:30px;height:30px;border-radius:8px;box-shadow:none}
.sheet .sh button{margin-left:auto;background:#e7ecf1;border-radius:99px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--ink)}
.sheet .sc{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;user-select:text}
.sheet .proj{grid-template-columns:1fr;padding:18px}
.sheet .welcome{padding:24px 20px}.sheet .welcome h1{font-size:32px}
.sheet .welcome .launch{grid-template-columns:1fr 1fr}
.hbar{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 8px);left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:rgba(11,22,32,.85)}
.plang{position:absolute;top:calc(env(safe-area-inset-top) + 54px);right:22px;display:none}

@media (max-width:820px){.desk{display:none}.phone{display:flex}}
@media (min-width:821px){.sheet{display:none}}

.i-goual{background:linear-gradient(145deg,#ffffff,#e9eef2)}
.i-insta{background:radial-gradient(circle at 30% 110%,#ffd36b 0%,#ff7a45 30%,#e0306a 55%,#9b3fd0 80%,#5a4bd6 100%)}
.i-luxe{background:linear-gradient(145deg,#3a2a12,#0f0b06)}
.i-k3d{background:linear-gradient(145deg,#ff9ec2,#c9427a)}
.i-shero{background:linear-gradient(145deg,#ff4b5c,#9e0f22)}
.icons{left:22px;right:auto;top:48px;grid-template-columns:repeat(2,96px);grid-auto-rows:min-content}
.win .open-ext{font-size:12px;font-weight:600;color:#167f8a;background:#e6f6f8;padding:5px 11px;border-radius:8px;margin-left:12px}
.win .load{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);font-size:13px;background:#fafbfc;transition:opacity .4s;pointer-events:none}
.sheet .sc iframe{width:100%;height:100%;border:0;display:block}
.sheet .sc{overflow:hidden}
.sheet .sh a{font-size:13px;font-weight:600;color:#167f8a;margin-left:auto}
.sheet .sh button{margin-left:10px}

/* ---------- météo + humour ---------- */
.bar .wx{display:flex;align-items:center;gap:5px}.bar .wx svg{width:15px;height:15px}
.meteo{position:absolute;top:46px;right:18px;width:300px;padding:16px 18px;border-radius:20px;background:rgba(255,255,255,.13);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);border:1px solid rgba(255,255,255,.2);box-shadow:0 20px 50px -20px rgba(0,0,0,.5);z-index:3}
.meteo .top{display:flex;justify-content:space-between;align-items:flex-start}
.meteo .city{font-size:13px;font-weight:600;opacity:.9}
.meteo .deg{font-size:46px;font-weight:200;letter-spacing:-2px;line-height:1.05}
.meteo .cond{font-size:12.5px;opacity:.85}
.meteo .wic svg{width:52px;height:52px}
.meteo .vs{margin-top:12px;padding-top:11px;border-top:1px solid rgba(255,255,255,.18);font-size:12.5px;display:flex;justify-content:space-between;opacity:.9}
.meteo .vs b{font-weight:600}
.meteo .joke{margin-top:10px;font-size:13px;line-height:1.45;font-style:italic;opacity:.95}
.meteo .joke2{margin-top:6px;font-size:12px;opacity:.7}
.meteo .wic svg{animation:sway 6s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(8deg) scale(1.05)}}
.widget .wxl{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px}
.widget .wxl svg{width:22px;height:22px;flex:none}
.widget .joke{font-style:italic}
.pdock{padding:10px 10px}
.pdock .ic{width:50px;height:50px;border-radius:13px}
@media (max-width:360px){.pdock .ic{width:44px;height:44px;border-radius:11px}}
.dock .di .ic{width:58px;height:58px}
</style>
</head>
<body>
<div class="wall"><i></i><i></i><i></i><i></i><div class="wm">goual.<small>STUDIO</small></div></div>

<div class="desk" id="desk">
  <div class="bar">
    <a class="brand" href="https://goual.fr">goual<i>.</i></a>
    <span class="m"><span data-fr>Mes sites web</span><span data-en>My websites</span></span>
    <div class="r"><span class="lg"><button data-l="fr">FR</button><button data-l="en">EN</button></span><span class="wx" id="barWx"></span><span>Dubai</span><span class="clock"></span></div>
  </div>
  <div class="meteo" id="meteo"><div class="top"><div><div class="city" data-fr>Dubaï, maintenant</div><div class="city" data-en>Dubai, right now</div><div class="deg" id="mDeg">--°</div><div class="cond" id="mCond"></div></div><div class="wic" id="mIc"></div></div><div class="vs" id="mVs"></div><div class="joke" id="mJoke"></div><div class="joke2" id="mJoke2"></div></div>
  <div class="icons" id="icons"></div>
  <div class="dock" id="dock"></div>
  <div class="toast" id="toast"><div class="ic i-goual" id="toastIc"></div><div><b>Goual Studio</b><span data-fr>Cliquez sur un projet pour ouvrir le site en direct.</span><span data-en>Click a project to open the live website.</span></div></div>
</div>

<div class="phone" id="phone">
  <div class="sbar"><span class="clock"></span><span class="ri"><svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><span class="batt"><i></i></span></span></div>
  <div class="home">
    <div class="widget">
      <div class="wl"><div><div class="lg2">goual<i>.</i></div><small>STUDIO</small></div><div class="clk"><b class="clock"></b><span>Dubai</span></div></div>
      <div class="wxl" id="pWx"></div>
      <p class="joke" id="pJoke"></p>
      <p style="margin-top:6px;opacity:.75;font-size:12px"><span data-fr>Touchez une app pour ouvrir le site en direct.</span><span data-en>Tap an app to open the live site.</span></p>
    </div>
    <div class="grid" id="grid"></div>
    <div class="dots"><i class="on"></i><i></i></div>
  </div>
  <div class="pdock" id="pdock"></div>
</div>

<div class="sheet" id="sheet"><div class="sh"><div class="ic" id="shIc"></div><b id="shT"></b><a id="shExt" target="_blank" rel="noopener">↗</a><button id="shX">OK</button></div><div class="sc" id="shC"></div><div class="hbar"></div></div>

<script>
// liens réseaux : à compléter
const INSTAGRAM="https://www.instagram.com/";
const YOUTUBE="https://www.youtube.com/";
const TIKTOK="https://www.tiktok.com/";

const P=[
 {k:'pool',cls:'i-pool',fr:'Piscine 3D',en:'Pool 3D',url:'https://studio.goual.fr/piscine/'},
 {k:'komi',cls:'i-komi',fr:'KŌMI',en:'KŌMI',url:'https://mane458957-maker.github.io/komi/'},

 {k:'k3d',cls:'i-k3d',fr:'KŌMI 3D',en:'KŌMI 3D',url:'https://mane458957-maker.github.io/komi/version-3d.html'},

const L=()=>document.documentElement.lang;
const waHref=()=>L()==='en'?'https://wa.me/971503154697':'https://wa.me/33659039438';
const ic=(cls,k)=>`<div class="ic ${cls}">${k==='wa'?'<img src="img/wa.png" alt="WhatsApp">':SVG[k]}</div>`;
const DOCK=()=>[
 {cls:'i-goual',k:'goual',href:'https://goual.fr',t:'goual.fr'},
 {cls:'i-wa',k:'wa',href:waHref(),t:'WhatsApp',ext:1},
 {cls:'i-mail',k:'mail',href:'mailto:contact@goual.fr',t:'contact@goual.fr'},
 {cls:'i-insta',k:'insta',href:INSTAGRAM,t:'Instagram',ext:1},
 {cls:'i-tt',k:'tt',href:TIKTOK,t:'TikTok',ext:1},
 {cls:'i-yt',k:'yt',href:YOUTUBE,t:'YouTube',ext:1}
];
function setLang(l){document.documentElement.lang=l;setTimeout(()=>{try{renderWx()}catch(e){}},0);document.querySelectorAll('.lg button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));build();document.querySelectorAll('.win .tt').forEach(t=>t.textContent=P.find(p=>p.k===t.dataset.k)[l]);try{localStorage.setItem('gs-lang',l)}catch(e){}}
document.querySelectorAll('.lg button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
function tick(){const t=new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Dubai'});document.querySelectorAll('.clock').forEach(c=>c.textContent=t)}
tick();setInterval(()=>{tick();try{renderWx()}catch(e){}},15000);

const desk=document.getElementById('desk'),icons=document.getElementById('icons'),dock=document.getElementById('dock');
const grid=document.getElementById('grid'),pdock=document.getElementById('pdock'),sheet=document.getElementById('sheet');
function build(){
  const l=L();
  icons.innerHTML=P.map(p=>`<div class="dicon" data-p="${p.k}">${ic(p.cls,p.k)}<span>${p[l]}</span></div>`).join('');
  const d=DOCK();
  dock.innerHTML=d.map(x=>`<a class="di" href="${x.href}" ${x.ext?'target="_blank" rel="noopener"':''}>${ic(x.cls,x.k)}<span class="tip">${x.t}</span></a>`).join('');
  grid.innerHTML=P.map(p=>`<button class="app" data-p="${p.k}">${ic(p.cls,p.k)}<span>${p[l]}</span></button>`).join('')+`<button class="app" id="langApp">${ic('i-lang','lang')}<span>${l==='en'?'Français':'English'}</span></button>`;
  pdock.innerHTML=d.map(x=>`<a href="${x.href}" ${x.ext?'target="_blank" rel="noopener"':''}>${ic(x.cls,x.k)}</a>`).join('');
  document.getElementById('langApp').onclick=()=>setLang(l==='en'?'fr':'en');
}
let z=10,wins={},cascade=0;
function openP(k){
  const p=P.find(x=>x.k===k); if(!p)return;
  if(innerWidth<=820){
    document.getElementById('shC').innerHTML=`<iframe src="${p.url}" allow="fullscreen"></iframe>`;
    const i=document.getElementById('shIc');i.className='ic '+p.cls;i.innerHTML=SVG[p.k];
    document.getElementById('shT').textContent=p[L()];document.getElementById('shExt').href=p.url;
    sheet.classList.add('show');return;
  }
  if(wins[k]){focus(wins[k]);wins[k].style.display='flex';requestAnimationFrame(()=>wins[k].classList.add('show'));return}
  const w=Math.min(1180,innerWidth-200),h=Math.min(720,innerHeight-140);
  const x=Math.max(120,(innerWidth-w)/2+40+cascade*30),y=Math.max(40,(innerHeight-h)/2-40+cascade*24);cascade=(cascade+1)%5;
  const el=document.createElement('div');el.className='win';el.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
  el.innerHTML=`<div class="tb"><div class="t">${ic(p.cls,p.k)}<span class="tt" data-k="${k}">${p[L()]}</span></div><a class="open-ext" href="${p.url}" target="_blank" rel="noopener"><span data-fr>Ouvrir dans un onglet</span><span data-en>Open in a new tab</span> ↗</a><div class="ctl"><button class="mn"><svg width="12" height="12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.6"/></svg></button><button class="mx"><svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="8" height="8" rx="1.5"/></svg></button><button class="x"><svg width="12" height="12"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.6"/></svg></button></div></div><div class="body"><iframe src="${p.url}" allow="fullscreen"></iframe><div class="load"><span data-fr>Chargement du site…</span><span data-en>Loading the site…</span></div></div>`;
  desk.appendChild(el);wins[k]=el;focus(el);requestAnimationFrame(()=>el.classList.add('show'));
  const fr=el.querySelector('iframe'),ld=el.querySelector('.load');fr.onload=()=>ld.style.opacity=0;
  el.querySelector('.x').onclick=()=>{el.classList.remove('show');setTimeout(()=>{el.remove();delete wins[k]},220)};
  el.querySelector('.mn').onclick=()=>{el.classList.remove('show');setTimeout(()=>el.style.display='none',200)};
  el.querySelector('.mx').onclick=()=>el.classList.toggle('max');
  el.addEventListener('mousedown',()=>focus(el));
  const tb=el.querySelector('.tb');let dx,dy,drag=false;
  tb.addEventListener('mousedown',e=>{if(e.target.closest('button,a'))return;drag=true;dx=e.clientX-el.offsetLeft;dy=e.clientY-el.offsetTop;el.style.transition='none';el.classList.remove('max');fr.style.pointerEvents='none'});
  addEventListener('mousemove',e=>{if(!drag)return;el.style.left=Math.min(innerWidth-120,Math.max(-w+160,e.clientX-dx))+'px';el.style.top=Math.min(innerHeight-120,Math.max(32,e.clientY-dy))+'px'});
  addEventListener('mouseup',()=>{if(drag){drag=false;el.style.transition='';fr.style.pointerEvents=''}});
  tb.addEventListener('dblclick',()=>el.classList.toggle('max'));
}
function focus(el){el.style.zIndex=++z}
document.addEventListener('click',e=>{const o=e.target.closest('[data-p]');if(o)openP(o.dataset.p)});
document.getElementById('shX').onclick=()=>{sheet.classList.remove('show');setTimeout(()=>document.getElementById('shC').innerHTML='',400)};

const T={

  hot:'Parfait pour une piscine. Ça tombe bien, j’en fais les sites.',warm:'Température idéale pour signer un devis.',cool:'Frais pour Dubaï : on sort la petite laine… à 22°.',
  vs:(a,b)=>`Dubaï <b>${a}°</b> · Paris <b>${b}°</b>`,vs2:d=>d>15?'Je dis ça, je dis rien.':'Match serré aujourd’hui.',
  hour:h=>h<5?`Il est ${h}h à Dubaï. Oui, je suis encore en train de coder.`:h<9?'Le café chauffe, les sites aussi.':h<12?'Matinée productive : les maquettes sortent du four.':h<14?'Pause shawarma. Les sites, eux, ne s’arrêtent jamais.':h<18?'Il fait chaud dehors. Mes sites aussi.':h<22?'Coucher de soleil sur Dubaï, nouveau site à l’horizon.':`Il est ${h}h. Pas de souci, les sites ne dorment pas.`},
 en:{cond:{sun:'Sunny',moon:'Clear night',cloud:'A few clouds',rain:'Rain (yes, in Dubai)'},
  hot:'Perfect pool weather. Good thing I build pool websites.',warm:'Ideal temperature to sign a quote.',cool:'Chilly for Dubai: time for a jacket… at 22°.',
  vs:(a,b)=>`Dubai <b>${a}°</b> · New York <b>${b}°</b>`,vs2:d=>d>15?'Just saying.':'Close match today.',
  hour:h=>h<5?`It’s ${h}am in Dubai. Yes, I’m still coding.`:h<9?'Coffee’s brewing, so are the websites.':h<12?'Productive morning: fresh mockups out of the oven.':h<14?'Shawarma break. Websites never take one.':h<18?'It’s hot outside. So are my websites.':h<22?'Sunset over Dubai, new website on the horizon.':`It’s ${h>12?h-12:h}pm. Don’t worry, websites never sleep.`}
};
let WX=null;
function dxbHour(){return +new Date().toLocaleString('en-GB',{hour:'2-digit',hour12:false,timeZone:'Asia/Dubai'})%24}
function kind(code,h){if(code>=51)return 'rain';if(code>=2)return 'cloud';return(h<6||h>=18)?'moon':'sun'}
function renderWx(){
  const l=L(),t=T[l],h=dxbHour();
  const k=WX?kind(WX.code,h):((h<6||h>=18)?'moon':'sun');
  const joke2=t.hour(h);
  document.getElementById('mIc').innerHTML=WX_IC[k];
  document.getElementById('mCond').textContent=t.cond[k];
  document.getElementById('mJoke2').textContent=joke2;
  let joke=t.hot;
  if(WX){
    const d=Math.round(WX.dxb),o=Math.round(l==='en'?WX.ny:WX.par);
    joke=d>=30?t.hot:d>=24?t.warm:t.cool;
    document.getElementById('mDeg').textContent=d+'°';
    document.getElementById('mVs').innerHTML=`<span>${t.vs(d,o)}</span><span>${t.vs2(d-o)}</span>`;
    document.getElementById('barWx').innerHTML=WX_IC[k]+d+'°';
    document.getElementById('pWx').innerHTML=WX_IC[k]+`<span>${t.vs(d,o)} — ${t.vs2(d-o)}</span>`;
  }else{document.getElementById('mVs').style.display='none';document.getElementById('pWx').innerHTML=WX_IC[k]+`<span>${t.cond[k]}</span>`}
  document.getElementById('mJoke').textContent=joke;
  document.getElementById('pJoke').textContent=joke2;
}
fetch('https://api.open-meteo.com/v1/forecast?latitude=25.2,48.86,40.71&longitude=55.27,2.35,-74.01&current=temperature_2m,weather_code')
 .then(r=>r.json()).then(a=>{WX={dxb:a[0].current.temperature_2m,code:a[0].current.weather_code,par:a[1].current.temperature_2m,ny:a[2].current.temperature_2m};document.getElementById('mVs').style.display='';renderWx()})
 .catch(()=>{});

let l0='fr';try{l0=localStorage.getItem('gs-lang')||((navigator.language||'').toLowerCase().startsWith('fr')?'fr':'en')}catch(e){}
const q=new URLSearchParams(location.search).get('lang');if(q==='en'||q==='fr')l0=q;
setLang(l0);
document.getElementById('toastIc').innerHTML=SVG.goual;
if(innerWidth>820){setTimeout(()=>document.getElementById('toast').classList.add('show'),1200);setTimeout(()=>document.getElementById('toast').classList.remove('show'),7000)}
